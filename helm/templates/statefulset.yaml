
apiVersion: "apps/v1"
kind: "StatefulSet"

metadata:
  name: "dss"
  namespace: "{{ $.Release.Namespace }}"
  labels:
    app: "dss"

spec:
  selector:
    matchLabels:
      app: "dss"
  template:
    metadata:
      annotations:
        image: "{{ $.Values.ImageNameAnonDss }}:{{ $.Values.ImageTagAnonDss }}"
      name: "dss"
      labels:
        app: "dss"

    spec:

      volumes:
        - name: "dss"
          hostPath:
            path: "{{ $.Values.HostPath }}"
            type: "Directory"

      containers:

        - name: "dss"
          image: "{{ $.Values.ImageNameAnonDss }}:{{ $.Values.ImageTagAnonDss }}"
          imagePullPolicy: "IfNotPresent"
          ports:
            - containerPort: 80
          volumeMounts:
            - name: "dss"
              mountPath: "/dss/downloads/"
          env:
            - name: "DownloadsDir"
              value: "{{ $.Values.DownloadsDir }}"
            - name: "DownloadsDirMaxSize"
              value: "{{ $.Values.DownloadsDirMaxSize }}"


